spring.application.name=gateway
server.port=9000
spring.security.oauth2.resourceserver.jwt.issuer-url=http://localhost:8181/realms/springboot-microservice-security-realm
#header authorization
spring.security.oauth2.resourceserver.jwt.issuer-uri-cert=http://localhost:8181/realms/springboot-microservice-security-realm/protocol/openid-connect/certs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs
